service:
  name: helm-chart-repro
  identifier: helmchartrepro
  orgIdentifier: default
  projectIdentifier: thrishank_test
  serviceDefinition:
    spec:
      manifests:
        - manifest:
            identifier: redis
            type: HelmChart
            spec:
              store:
                type: Http
                spec:
                  connectorRef: http_helm_bitnami
              optionalValuesYaml: false
              chartName: redis
              chartVersion: <+input>
              subChartPath: ""
              helmVersion: V3
              skipResourceVersioning: false
              enableDeclarativeRollback: false
              fetchHelmChartMetadata: false
    type: NativeHelm
