service:
  name: helm-chart-repo
  identifier: helmchartrepo
  orgIdentifier: default
  projectIdentifier: thrishank_test
  serviceDefinition:
    spec:
      manifests:
        - manifest:
            identifier: test
            type: HelmChart
            spec:
              store:
                type: Http
                spec:
                  connectorRef: http_helm_bitnami
              optionalValuesYaml: false
              chartName: nginx
              chartVersion: <+input>
              subChartPath: ""
              helmVersion: V3
              skipResourceVersioning: false
              enableDeclarativeRollback: false
              fetchHelmChartMetadata: false
    type: NativeHelm
